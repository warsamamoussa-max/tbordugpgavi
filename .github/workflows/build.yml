name: Build UGP-GAVI Desktop App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-13
            script: dist:mac
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: electron-app

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build (${{ matrix.os }}) with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Tentative $attempt..."
            if npm run ${{ matrix.script }}; then
              echo "Build reussi"
              exit 0
            fi
            echo "Echec tentative $attempt, nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Echec apres 3 tentatives"
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ugp-gavi-dashboard-${{ matrix.os }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.dmg
            electron-app/dist/*.blockmap
          if-no-files-found: warn
